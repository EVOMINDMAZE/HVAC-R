name: Stripe Money Path Setup (one-off)

on:
  workflow_dispatch:
    inputs:
      stripe_secret_key:
        description: "STRIPE_SECRET_KEY — runtime only, never committed"
        required: true
        type: string

env:
  SUPABASE_PROJECT_REF: tbmizbqftczbsbwqgyjx
  BILLING_WEBHOOK_URL: https://tbmizbqftczbsbwqgyjx.supabase.co/functions/v1/billing/webhook
  PK_FRAGMENT: I3qx3nvIgh

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify key + account identity
        env:
          SK: ${{ inputs.stripe_secret_key }}
        run: |
          ACC=$(curl -s https://api.stripe.com/v1/account -u "$SK:")
          ID=$(echo "$ACC" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('id','ERR'))")
          LIVEMODE=$(echo "$ACC" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('livemode','ERR'))")
          echo "account_id=$ID livemode=$LIVEMODE"
          echo "$ID" | grep -q "$PK_FRAGMENT" || { echo "::error::key account $ID does not match pk fragment $PK_FRAGMENT"; exit 1; }

      - name: Cross-check the 4 price IDs (active + livemode + same account)
        env:
          SK: ${{ inputs.stripe_secret_key }}
        run: |
          for P in price_1U9Zi9I3qx3nvIghi9IaPk0b price_1U9ZiSI3qx3nvIgh1CDjYb2S price_1U9ZiTI3qx3nvIghkDstxZKX price_1U9ZiTI3qx3nvIgh5iTE3AWY; do
            R=$(curl -s "https://api.stripe.com/v1/prices/$P" -u "$SK:")
            echo "$P -> $(echo "$R" | python3 -c "import json,sys;d=json.load(sys.stdin);print('active='+str(d.get('active')),'live='+str(d.get('livemode')),'unit='+str(d.get('unit_amount')),'cur='+str(d.get('currency')))")"
            echo "$R" | grep -q '"livemode": true' || { echo "::error::$P not a live-mode price"; exit 1; }
          done

      - name: Register webhook endpoint (fails if one already exists)
        id: wh
        env:
          SK: ${{ inputs.stripe_secret_key }}
        run: |
          URL="$BILLING_WEBHOOK_URL"
          EXISTING=$(curl -s "https://api.stripe.com/v1/webhook_endpoints?limit=100" -u "$SK:")
          if echo "$EXISTING" | grep -q "$URL"; then
            echo "::error::Webhook endpoint already exists and its signing secret cannot be re-read. Delete it in the Stripe dashboard, then re-run this workflow."
            exit 1
          fi
          RESP=$(curl -s -X POST https://api.stripe.com/v1/webhook_endpoints -u "$SK:" \
            -d "url=$URL" \
            -d "enabled_events[]=checkout.session.completed" \
            -d "enabled_events[]=customer.subscription.updated" \
            -d "enabled_events[]=customer.subscription.deleted" \
            -d "enabled_events[]=invoice.payment_succeeded" \
            -d "enabled_events[]=invoice.payment_failed" \
            -d "description=ThermoNeural Box billing")
          SECRET=$(echo "$RESP" | python3 -c "import json,sys;print(json.load(sys.stdin).get('secret',''))")
          WHID=$(echo "$RESP" | python3 -c "import json,sys;print(json.load(sys.stdin).get('id',''))")
          [ -n "$SECRET" ] || { echo "::error::Stripe API failed:"; echo "$RESP" | sed 's/sk_[a-z]*_[A-Za-z0-9]*/[REDACTED]/g'; exit 1; }
          echo "webhook_endpoint=$WHID"
          echo "WEBHOOK_SECRET=$SECRET" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set edge function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SK: ${{ inputs.stripe_secret_key }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase secrets set STRIPE_SECRET_KEY="$SK" STRIPE_WEBHOOK_SECRET="$WEBHOOK_SECRET" CLIENT_URL="https://thermoneural.com"

      - name: Verify (names only — Supabase never returns secret values)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets list | awk 'NR>1 {print $1}'
