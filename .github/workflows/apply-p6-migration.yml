# ONE-SHOT (Phase 6): applies 20260905120000_catalog_scans.sql to the shared
# Supabase project via the Management API, because `supabase db push` refuses
# to run against the shared remote (history contains sibling-repo migrations
# not present in this repo). The workflow comment on `deploy-supabase-db`
# documents the policy: remote schema history is applied manually. This wrapper
# IS that manual step, automated and logged. DELETE after p6-close.
name: Apply P6 catalog migration (one-shot)
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Apply catalog_scans DDL via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: tbmizbqftczbsbwqgyjx
        run: |
          cat > /tmp/p6.sql <<'SQL'
          create table if not exists public.catalog_scans (
            id bigint generated always as identity primary key,
            slug text not null,
            scanned_at timestamptz not null default now(),
            user_agent text,
            referer text
          );
          alter table public.catalog_scans enable row level security;
          create index if not exists catalog_scans_slug_time_idx
            on public.catalog_scans (slug, scanned_at desc);
          SQL
          Q=$(jq -Rs . /tmp/p6.sql)
          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": ${Q}}")
          echo "HTTP $HTTP"
          cat /tmp/resp.json
          # Management API returns 201 (Success Content) on a successful query.
          case "$HTTP" in 200|201) exit 0;; *) exit 1;; esac
