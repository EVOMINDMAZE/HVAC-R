name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  NODE_VERSION: "20"

jobs:
  quality:
    name: Lint, Typecheck, Unit Tests, Coverage, Docs SOT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: cp .env.template .env && npm run test

      - name: Coverage thresholds
        run: cp .env.template .env && npm run test:coverage

      - name: Docs source-of-truth
        run: npm run check:docs-sot

  policy-automation:
    name: RBAC, Privacy, and Security Policy Automation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Policy regression tests
        run: cp .env.template .env && npm run test:policy:automation

  # Security gate - runs npm audit and evaluates against allowlist
  security-gate:
    name: Security Audit Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate audit report
        run: |
          mkdir -p output
          npm audit --json > output/audit.json || true

      - name: Security gate
        run: npm run audit:gate

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-report
          path: output/audit.json
          retention-days: 30

  # Deterministic E2E smoke test - runs on every PR
  # Tests only public pages that don't require auth or external services
  e2e-smoke:
    name: E2E Smoke (deterministic)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start frontend server
        run: cp .env.template .env && npm run dev &
        env:
          # Use CI-friendly settings
          NODE_ENV: test
          PORT: 8080

      - name: Wait for server ready
        run: npx wait-on http://localhost:8080 --timeout 60000

      - name: Run E2E smoke tests
        run: cp .env.template .env && npm run test:ux:regression -- --retries=2
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 7

  # Full E2E suite - manual dispatch only (requires Supabase/seeded users)
  e2e-full:
    name: E2E Full Suite (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # NOTE: Many E2E scenarios require Supabase (Docker) and seeded users.
      # Keep this job opt-in until a CI-compatible Supabase setup is defined.
      - name: Run Playwright tests
        run: cp .env.template .env && npm run test:e2e
