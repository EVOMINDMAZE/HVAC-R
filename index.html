<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>
    // Apply theme before first paint to avoid a flash of the wrong theme and to
    // persist the user's choice across reloads. Dark is the default.
    (function () {
      try {
        var stored = localStorage.getItem("vite-ui-theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : stored === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : "dark";
        document.documentElement.classList.add(theme);
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <!-- Default title; react-helmet-async overrides per route after hydration -->
  <title>ThermoNeural — HVAC&R Engineering &amp; Business Platform</title>
  <meta property="og:title" content="ThermoNeural — HVAC&R Engineering &amp; Business Platform" />
  <meta property="og:site_name" content="ThermoNeural" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <meta name="description"
    content="ThermoNeural is the professional platform for HVAC&R thermodynamics. Simulate cycles, analyze refrigerants, and optimize systems with NIST-verified accuracy." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>

<body>
  <div id="root"></div>

  <script type="module" src="/client/main.tsx"></script>
</body>

</html>
