/* Landing Animations */
/* Interactive Engineering Core */
@media (max-width: 1024px) {
  .core-grid {
    grid-template-columns: 1fr;
    gap: 1.5rem;
    min-height: auto;
  }

  .core-viewport {
    display: none;
  }
}


.core-module-nav {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.core-module-item {
  padding: 2rem;
  border-radius: 1rem;
  background: transparent;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.2, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}

  .core-module-item {
    padding: 1rem;
  }

.core-module-item::before {
  content: '';

  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: var(--landing-primary);
  opacity: 0;
  transform: scaleY(0);
  transition: transform 0.4s ease, opacity 0.4s ease;
}

.core-module-item:hover {
  background: rgba(0, 0, 0, 0.03);
}

  background: rgba(255, 255, 255, 0.03);
}

.core-module-item.active {
  background: var(--landing-panel-light);
  border-color: var(--landing-primary);
  box-shadow: 0 15px 45px -12px rgba(var(--landing-primary-rgb), 0.2);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.dark .core-module-item.active {
  background: var(--landing-panel-dark);
}

.core-module-item.active::before {
  opacity: 1;
  transform: scaleY(1);
}

.core-module-item.active h3 {
  color: var(--landing-primary);
}

@media (min-width: 1024px) {

    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: auto auto;
    gap: 2.5rem;
    min-height: auto;
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem 0;

    display: contents;
  }

    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    background: var(--landing-panel-light);
    border: 1px solid var(--landing-glass-border);
    backdrop-filter: blur(14px);
  }

  .dark .core-module-item {
    background: var(--landing-panel-dark);
  }

  .core-module-item.active {
    border-color: var(--landing-primary);
    box-shadow: 0 20px 60px -15px rgba(var(--landing-primary-rgb), 0.3);
  }

  .core-viewport {
    display: none !important;
  }
}

.core-viewport {
  position: relative;
  border-radius: 1.5rem;
  overflow: hidden;
  border: 1px solid var(--landing-glass-border);
  background: hsl(var(--secondary) / 0.5);
  box-shadow:
    inset 0 0 120px rgba(0, 0, 0, 0.25),
    0 25px 50px -12px rgba(0, 0, 0, 0.15);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.dark .core-viewport {
  background: #000;
  box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
}

.core-viewport-image {
  width: 100%;
  height: 100%;
  -o-object-fit: contain;
     object-fit: contain;
  -o-object-position: center;
     object-position: center;
  background: transparent;
  transition: transform 1.2s cubic-bezier(0.2, 0, 0.2, 1), opacity 0.5s ease;
  opacity: 0;
  position: absolute;
  inset: 0;
}

.core-viewport-image.active {
  opacity: 1;
  transform: scale(1.02);
  filter: saturate(1.1) contrast(1.05);
}

.dark .core-viewport-image.active {
  opacity: 0.8;
}

.core-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 2.5rem;
  background: linear-gradient(to top,
      var(--landing-panel-dark) 0%,
      rgba(15, 23, 42, 0.8) 40%,
      transparent 100%);

  justify-content: space-between;
  align-items: flex-end;
  border-top: 1px solid var(--landing-glass-border);
  backdrop-filter: blur(4px);

.dark .core-overlay {
  background: linear-gradient(to top, #000 0%, transparent 100%);

    background: linear-gradient(90deg, hsl(var(--info) / 0.85), hsl(var(--primary) / 0.72));
  }
.monitor-kpi[data-tone="success"] .monitor-kpi-meter {
    background:
      conic-gradient(
        hsl(var(--success) / 0.88) var(--monitor-kpi-meter),
        hsl(var(--border) / 0.55) 0
      );
  }
.monitor-kpi[data-tone="warning"] .monitor-kpi-meter {
    background:
      conic-gradient(
        hsl(var(--warning) / 0.9) var(--monitor-kpi-meter),
        hsl(var(--border) / 0.55) 0
      );
  }
.monitor-kpi[data-tone="danger"] .monitor-kpi-meter {
    background:
      conic-gradient(
        hsl(var(--destructive) / 0.88) var(--monitor-kpi-meter),
        hsl(var(--border) / 0.55) 0
      );
  }
.monitor-kpi[data-tone="info"] .monitor-kpi-meter {
    background:
      conic-gradient(
        hsl(var(--info) / 0.88) var(--monitor-kpi-meter),
        hsl(var(--border) / 0.55) 0
      );
  }
.monitor-kpi[data-tone="success"] .monitor-kpi-bars span {
    background: linear-gradient(180deg, hsl(var(--success) / 0.88), hsl(var(--highlight) / 0.48));
  }
.monitor-kpi[data-tone="warning"] .monitor-kpi-bars span {
    background: linear-gradient(180deg, hsl(var(--warning) / 0.9), hsl(var(--accent) / 0.45));
  }
.monitor-kpi[data-tone="danger"] .monitor-kpi-bars span {
    background: linear-gradient(
      180deg,
      hsl(var(--destructive) / 0.88),
      hsl(var(--accent) / 0.44)
    );
  }
.monitor-chart-stat {
    box-shadow: inset 0 1px 0 hsl(var(--background) / 0.48);
  }
.monitor-chart-story {
    letter-spacing: 0.02em;
  }
.monitor-diagram-node {
    box-shadow: inset 0 1px 0 hsl(var(--background) / 0.4);
  }
.monitor-diagram-index,
  .monitor-diagram-marker {
    box-shadow:
      inset 0 1px 0 hsl(var(--background) / 0.5),
      0 0 0 1px hsl(var(--primary) / 0.12);
  }
.monitor-diagram-connector {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 1.35rem;
    color: hsl(var(--primary) / 0.55);
  }
.monitor-diagram-legend {
    box-shadow: inset 0 1px 0 hsl(var(--background) / 0.45);
  }
.monitor-diagram-node[data-tone="success"] {
    box-shadow:
      inset 0 0 0 1px hsl(var(--success) / 0.12),
      inset 0 1px 0 hsl(var(--background) / 0.3);
  }
.monitor-diagram-node[data-tone="warning"] {
    box-shadow:
      inset 0 0 0 1px hsl(var(--warning) / 0.16),
      inset 0 1px 0 hsl(var(--background) / 0.3);
  }
.monitor-diagram-node[data-tone="danger"] {
    box-shadow:
      inset 0 0 0 1px hsl(var(--destructive) / 0.14),
      inset 0 1px 0 hsl(var(--background) / 0.3);
  }
.monitor-diagram-node[data-tone="info"] {
    box-shadow:
      inset 0 0 0 1px hsl(var(--info) / 0.14),
      inset 0 1px 0 hsl(var(--background) / 0.3);
  }
.monitor-motion-enabled .monitor-panel,
  .monitor-motion-enabled .monitor-meta-chip {
    transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
  }
.monitor-motion-enabled .monitor-panel:hover {
    transform: translateY(-1px);
    box-shadow:
      0 10px 24px -18px hsl(var(--foreground) / 0.6),
      inset 0 1px 0 hsl(var(--background) / 0.4);
  }
.monitor-motion-enabled .monitor-kpi {
    transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
  }
.monitor-motion-enabled .monitor-kpi:hover {
    transform: translateY(-1px);
    box-shadow:
      0 12px 22px -18px hsl(var(--foreground) / 0.52),
      inset 0 1px 0 hsl(var(--background) / 0.38);
  }
.monitor-motion-enabled .monitor-kpi .monitor-kpi-accent {
    transition: width 220ms ease, box-shadow 220ms ease;
  }
.monitor-motion-enabled .monitor-kpi:hover .monitor-kpi-accent {
    width: 3.5rem;
    box-shadow: 0 0 18px -8px hsl(var(--primary) / 0.74);
  }
.monitor-motion-enabled .monitor-kpi-bars span {
    transition: transform 180ms ease, opacity 180ms ease;
  }
.monitor-motion-enabled .monitor-kpi:hover .monitor-kpi-bars span {
    transform: translateY(-1px);
    opacity: 0.95;
  }
.monitor-motion-enabled .monitor-diagram-node {
    transition: transform 180ms ease, border-color 180ms ease;
  }
.monitor-motion-enabled .monitor-diagram-node:hover {
    transform: translateX(2px);
  }
.monitor-motion-enabled .monitor-shell::after {
    animation-play-state: running;
  }
.monitor-motion-reduced .monitor-panel,
  .monitor-motion-reduced .monitor-meta-chip,
  .monitor-motion-reduced .monitor-kpi,
  .monitor-motion-reduced .monitor-diagram-node,
  .monitor-motion-reduced .monitor-kpi .monitor-kpi-accent,
  .monitor-motion-reduced .monitor-kpi-bars span,
  .monitor-motion-reduced .monitor-shell::after,
  .monitor-motion-reduced .monitor-shell-status::before,
  .monitor-motion-reduced .monitor-hud-indicator,
  .monitor-motion-reduced .monitor-blueprint-connectors {
    transition: none;
    animation: none;
  }
@keyframes monitorSweep {
    from {
      transform: translateX(-28%);
    }
    to {
      transform: translateX(28%);
    }
  }
@keyframes monitorPulse {
    0% {
      box-shadow: 0 0 0 0 hsl(var(--highlight) / 0.48);
      opacity: 1;
    }
    70% {
      box-shadow: 0 0 0 8px hsl(var(--highlight) / 0);
      opacity: 0.7;
    }
    100% {
      box-shadow: 0 0 0 0 hsl(var(--highlight) / 0);
      opacity: 1;
    }
  }
@keyframes monitorScan {
    from {
      transform: translateY(-8%);
    }
    to {
      transform: translateY(8%);
    }
  }
/* Scrollbar Hide */
.scrollbar-hide {
    -ms-overflow-style: none;

    scrollbar-width: none;

  }
.scrollbar-hide::-webkit-scrollbar {

/* ============================================
   INFOGRAPHIC COMPONENT STYLES
   ============================================ */
/* Ops Status Bar */
.ops-status-bar {
  display: flex;
  flex-direction: column;
  gap: var(--infographic-gap);
  padding: var(--infographic-padding-lg);
  border-radius: var(--radius-stat);
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  box-shadow: var(--infographic-shadow);
}
.dark .ops-status-bar {
  box-shadow: none;
}
.ops-status-bar__header {
  display: flex;
  align-items: center;
  gap: var(--infographic-gap-sm);
  flex-wrap: wrap;
}
.ops-status-bar__indicator {
  color: hsl(var(--status-clear));
  font-size: 0.875rem;
}
.ops-status-bar__title {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: hsl(var(--muted-foreground));
  text-transform: uppercase;
}
.ops-status-bar__readiness {
  font-size: 0.875rem;
  font-weight: 700;
  color: hsl(var(--foreground));
  margin-left: auto;
}
.ops-status-bar__bar {
  display: flex;
  gap: 2px;
  flex: 1;
  min-width: 100px;
  max-width: 200px;
}
.ops-status-bar__seg {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: hsl(var(--muted));
}
.ops-status-bar__seg--filled {
  background: hsl(var(--status-clear));
}
.ops-status-bar__flow {
  display: flex;
  align-items: center;
  gap: 0;
  overflow-x: auto;
  padding: var(--infographic-gap-sm) 0;
}
.ops-status-bar__stage-wrapper {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}
.ops-status-bar__stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 80px;
  padding: var(--infographic-padding);
  border-radius: var(--radius-flow);
  border: 1px solid hsl(var(--border));
  background: hsl(var(--background));
  transition: all var(--transition-fast);
}
.ops-status-bar__stage--queue {
  border-color: hsl(var(--stage-queue) / 0.4);
  background: linear-gradient(135deg, hsl(var(--stage-queue) / 0.08), transparent);
}
.ops-status-bar__stage--enroute {
  border-color: hsl(var(--stage-enroute) / 0.4);
  background: linear-gradient(135deg, hsl(var(--stage-enroute) / 0.08), transparent);
}
.ops-status-bar__stage--onsite {
  border-color: hsl(var(--stage-onsite) / 0.4);
  background: linear-gradient(135deg, hsl(var(--stage-onsite) / 0.08), transparent);
}
.ops-status-bar__stage--done {
  border-color: hsl(var(--stage-done) / 0.4);
  background: linear-gradient(135deg, hsl(var(--stage-done) / 0.08), transparent);
}
.ops-status-bar__stage--techs {
  border-color: hsl(var(--stage-techs) / 0.4);
  background: linear-gradient(135deg, hsl(var(--stage-techs) / 0.08), transparent);
}
.ops-status-bar__stage--clear {
  border-color: hsl(var(--status-clear) / 0.5);
}
.ops-status-bar__stage--attention {
  border-color: hsl(var(--status-attention) / 0.5);
}
.ops-status-bar__stage--neutral {
  border-color: hsl(var(--status-neutral) / 0.3);
}
.dark .ops-status-bar__stage--queue,
.dark .ops-status-bar__stage--enroute,
.dark .ops-status-bar__stage--onsite,
.dark .ops-status-bar__stage--done,
.dark .ops-status-bar__stage--techs {
  box-shadow: 0 0 20px hsl(var(--infographic-glow-opacity));
}
.ops-status-bar__stage-count {
  font-size: var(--text-flow-number);
  font-weight: 800;
  line-height: 1;
  color: hsl(var(--foreground));
  font-variant-numeric: tabular-nums;
}
.ops-status-bar__stage-label {
  font-size: var(--text-flow-label);
  font-weight: 700;
  letter-spacing: 0.08em;
  color: hsl(var(--muted-foreground));
  text-transform: uppercase;
  margin-top: 2px;
}
.ops-status-bar__stage-status {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 4px;
}
.ops-status-bar__stage-icon {
  width: 14px;
  height: 14px;
}
.ops-status-bar__stage--clear .ops-status-bar__stage-icon {
  color: hsl(var(--status-clear));
}
.ops-status-bar__stage--attention .ops-status-bar__stage-icon {
  color: hsl(var(--status-attention));
}
.ops-status-bar__stage--neutral .ops-status-bar__stage-icon {
  color: hsl(var(--status-neutral));
}
.ops-status-bar__arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 var(--infographic-gap-sm);
  font-size: 1.25rem;
  color: hsl(var(--muted-foreground) / 0.5);
}
.ops-status-bar__techs {
  margin-left: var(--infographic-gap);
}
.ops-status-bar__techs-active {
  font-size: 0.625rem;
  font-weight: 600;
  color: hsl(var(--muted-foreground));
  margin-left: 4px;
}
/* Action Queue */
.action-queue {

  flex-direction: column;

}
.action-queue__header {

}
.action-queue__title {

.action-queue__item-header {

}
.action-queue__item-id {

  font-weight: 700;
  color: hsl(var(--foreground));

}
.action-queue__item-type {
  font-size: 0.875rem;
  color: hsl(var(--muted-foreground));
}
.action-queue__item-location {
  font-size: 0.75rem;
  color: hsl(var(--muted-foreground));
}
.action-queue__item-badge {

  align-items: center;

  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.action-queue__item-badge--urgent {
  background: hsl(var(--status-critical) / 0.15);

}
.action-queue__item-badge--today {

}
.action-queue__item-badge--scheduled {
  background: hsl(var(--status-neutral) / 0.15);

.action-queue__item-meta {

.action-queue__item-actions {

.action-queue__link {

.action-queue__link:hover {

/* Quick Actions Panel */
.quick-actions-panel {

  gap: var(--infographic-gap);

}
.quick-actions-panel__header {

.quick-actions-panel__title {

.navigation-rail {

.navigation-rail__header {

.navigation-rail__badge {

  font-weight: 800;
  color: hsl(var(--foreground));
}
.insights-accordion__card-meta {
  font-size: 0.75rem;
  color: hsl(var(--muted-foreground));
}
/* Infographic Badge (CSS-only) */
.infographic-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-badge);
  position: relative;
}
.infographic-badge::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(
    circle at 30% 25%,
    hsl(var(--badge-color) / var(--infographic-glow-opacity)),
    transparent 60%
  );
  pointer-events: none;
}
.infographic-badge--xs { width: var(--badge-size-xs); height: var(--badge-size-xs); }
.infographic-badge--sm { width: var(--badge-size-sm); height: var(--badge-size-sm); }
.infographic-badge--md { width: var(--badge-size-md); height: var(--badge-size-md); }
.infographic-badge--lg { width: var(--badge-size-lg); height: var(--badge-size-lg); }
.infographic-badge--xl { width: var(--badge-size-xl); height: var(--badge-size-xl); }
.infographic-badge--queue { --badge-color: var(--stage-queue); }
.infographic-badge--enroute { --badge-color: var(--stage-enroute); }
.infographic-badge--onsite { --badge-color: var(--stage-onsite); }

/* Hover Effects & Transitions */

  transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
}
.ops-status-bar__stage:hover {
  transform: translateY(-2px);
  box-shadow: var(--infographic-shadow-lg);
}

  box-shadow: 0 0 20px hsl(var(--stage-queue) / var(--infographic-glow-opacity));
}
.ops-status-bar__stage--queue:hover {
  border-color: hsl(var(--stage-queue));
}
.ops-status-bar__stage--enroute:hover {
  border-color: hsl(var(--stage-enroute));
}
.ops-status-bar__stage--onsite:hover {
  border-color: hsl(var(--stage-onsite));
}
.ops-status-bar__stage--done:hover {
  border-color: hsl(var(--stage-done));
}
.ops-status-bar__stage--techs:hover {

}
.action-queue__item {

}
.action-queue__item:hover {

}
.navigation-rail__item {

}
.navigation-rail__item:hover {

}
.navigation-rail__item:active {

}
.quick-actions-panel {

}
.quick-actions-panel:hover {
  box-shadow: var(--infographic-shadow-lg);
}
.dark .quick-actions-panel:hover {

}
.recent-activity__item {

}
.recent-activity__item:hover {
  background: hsl(var(--muted) / 0.3);
}
.insights-accordion__card {

}
.insights-accordion__card:hover {
  transform: translateY(-2px);
  box-shadow: var(--infographic-shadow);
}
/* Loading State */

}
.dashboard-v2__skeleton-content {

}
.dashboard-v2__skeleton-card {

@keyframes skeleton-pulse {

  100% {

/* Unauth State */

/* Stage Count Animation */
@keyframes count-pulse {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.05);
  }
}
.ops-status-bar__stage-count {
  transition: transform 200ms ease;
}
.ops-status-bar__stage--attention .ops-status-bar__stage-count {
  animation: count-pulse 2s ease-in-out infinite;
}
/* Readiness Bar Animation */
.ops-status-bar__seg {
  transition: background 300ms ease;
}
.ops-status-bar__seg--filled {
  animation: seg-fill 500ms ease-out;
}
@keyframes seg-fill {
  from {
    transform: scaleX(0);
    opacity: 0;
  }
  to {
    transform: scaleX(1);
    opacity: 1;
  }
}
/* Badge Glow Animation */
@keyframes badge-glow {
  0%, 100% {
    opacity: 0.5;
  }
  50% {
    opacity: 1;
  }
}
.infographic-badge::before {
  animation: badge-glow 3s ease-in-out infinite;
}
/* Focus States */
.ops-status-bar__stage:focus-visible,
.action-queue__item:focus-visible,
.navigation-rail__item:focus-visible,
.quick-actions-panel:focus-visible,
.recent-activity__item:focus-visible,
.insights-accordion__summary:focus-visible {
  outline: 2px solid hsl(var(--ring));
  outline-offset: 2px;
}

  display: flex;
  flex-direction: column;
  gap: var(--infographic-gap-lg);
  padding: var(--infographic-padding-lg);
  border-radius: var(--radius-card-lg);
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  position: relative;
  overflow: hidden;
}
.ops-status-bar-v2::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg,
    hsl(var(--accent-queue)),
    hsl(var(--accent-enroute)),
    hsl(var(--accent-onsite)),
    hsl(var(--accent-done))

}
.ops-status-bar-v2__header {

  justify-content: space-between;
  gap: var(--infographic-gap);
}

  align-items: center;
  gap: var(--infographic-gap-sm);
}

  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: hsl(var(--accent-dispatch));
  animation: pulse-glow 2s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% {
    box-shadow: 0 0 0 0 hsl(var(--accent-dispatch) / 0.4);
  }
  50% {

/* Stage Cards */
.ops-stage-card {
  display: flex;
  flex-direction: column;
  gap: var(--infographic-gap-sm);
  min-width: 120px;
  padding: var(--infographic-padding);
  border-radius: var(--radius-card);
  border: 2px solid hsl(var(--border));
  transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}
.ops-stage-card--active {
  transform: translateY(-2px);
}
.ops-stage-card--queue.ops-stage-card--active {
  box-shadow: var(--shadow-glow-cyan);
}
.ops-stage-card--enroute.ops-stage-card--active {
  box-shadow: var(--shadow-glow-amber);
}
.ops-stage-card--onsite.ops-stage-card--active {
  box-shadow: var(--shadow-glow-emerald);
}
.ops-stage-card--done.ops-stage-card--active {
  box-shadow: var(--shadow-glow-blue);
}
.ops-stage-card__header {
  display: flex;
  align-items: center;
  gap: var(--infographic-gap-sm);
}
.ops-stage-card__icon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 200ms ease;

  border-radius: 0.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: hsl(var(--muted) / 0.5);
  flex-shrink: 0;
}
.nav-rail__badge-icon {
  width: 18px;
  height: 18px;
  color: hsl(var(--muted-foreground));
}
.nav-rail__content {
  flex: 1;
  min-width: 0;
}
.nav-rail__label {
  display: block;
  font-size: 0.875rem;
  font-weight: 500;
  color: hsl(var(--foreground));
  line-height: 1.3;
}
.nav-rail__desc {
  display: block;
  font-size: 0.75rem;
  color: hsl(var(--muted-foreground));
  line-height: 1.3;
}
.nav-rail__count {
  font-size: 0.875rem;
  font-weight: 600;
  color: hsl(var(--muted-foreground));
  font-variant-numeric: tabular-nums;
}
.nav-rail__arrow {
  color: hsl(var(--muted-foreground) / 0.5);
  transition: transform 150ms ease;
}
.nav-rail__item:hover .nav-rail__arrow {
  transform: translateX(2px);
  color: hsl(var(--muted-foreground));
}
/* Action Queue - Minimal */
.action-queue {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  padding: 1.25rem;
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  border-radius: 0.75rem;
}
.action-queue__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.action-queue__title {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.8125rem;
  font-weight: 600;
  color: hsl(var(--muted-foreground));
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.action-queue__title-icon {
  color: hsl(var(--foreground));
}
.action-queue__list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.action-queue__empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  text-align: center;
  color: hsl(var(--muted-foreground));
}
.action-queue__empty-icon {
  width: 32px;
  height: 32px;
  margin-bottom: 0.5rem;
  opacity: 0.5;
}
.action-queue__empty-text {
  font-size: 0.875rem;
}
/* Quick Actions Panel - Clean Form */
.quick-actions-panel {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding: 1.25rem;
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  border-radius: 0.75rem;
}
.quick-actions-panel__section-title {
  font-size: 0.6875rem;
  font-weight: 600;
  color: hsl(var(--muted-foreground));
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.quick-actions-panel__form {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
/* Recent Activity - Simple List */
.recent-activity {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  padding: 1.25rem;
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  border-radius: 0.75rem;
}
.recent-activity__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.recent-activity__title {
  font-size: 0.8125rem;
  font-weight: 600;
  color: hsl(var(--muted-foreground));
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.recent-activity__list {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}
.recent-activity__empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  text-align: center;
  color: hsl(var(--muted-foreground));
}
/* Insights Accordion - Refined */
.insights-accordion {
  border-radius: 0.75rem;
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  overflow: hidden;
}
.insights-accordion__summary {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 1rem 1.25rem;
  cursor: pointer;
  transition: background 150ms ease;
  list-style: none;
}
.insights-accordion__summary::-webkit-details-marker {
  display: none;
}
.insights-accordion__summary:hover {
  background: hsl(var(--muted) / 0.3);
}
.insights-accordion__chevron {
  color: hsl(var(--muted-foreground));
  transition: transform 150ms ease;
}
.insights-accordion[open] .insights-accordion__chevron {
  transform: rotate(90deg);
}
.insights-accordion__label {
  font-size: 0.8125rem;
  font-weight: 600;
  color: hsl(var(--muted-foreground));
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.insights-accordion__hint {
  font-size: 0.75rem;
  color: hsl(var(--muted-foreground));
  margin-left: auto;
}
.insights-accordion__content {
  padding: 0 1.25rem 1.25rem;
  border-top: 1px solid hsl(var(--border));
  margin-top: 0;
}
.insights-accordion__grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.75rem;
  margin-top: 1rem;
}
.insights-accordion__card {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  padding: 0.875rem;
  background: hsl(var(--muted) / 0.3);
  border-radius: 0.5rem;
  transition: background 150ms ease;
}
.insights-accordion__card:hover {
  background: hsl(var(--muted) / 0.5);
}
.insights-accordion__card-label {
  font-size: 0.625rem;
  font-weight: 600;
  color: hsl(var(--muted-foreground));
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.insights-accordion__card-value {
  font-size: 1.25rem;
  font-weight: 600;
  color: hsl(var(--foreground));
  line-height: 1.2;
}
.insights-accordion__card-meta {
  font-size: 0.6875rem;
  color: hsl(var(--muted-foreground));
}
.insights-accordion__card--warning .insights-accordion__card-value {
  color: hsl(38 92% 50%);
}
.insights-accordion__card--info .insights-accordion__card-value {
  color: hsl(189 94% 43%);
}
/* Dashboard V2 Layout */
.dashboard-v2 {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}
.dashboard-v2__header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  padding: 1.25rem 0;
}
.dashboard-v2__greeting {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}
.dashboard-v2__kicker {
  font-size: 0.6875rem;
  font-weight: 600;
  color: hsl(var(--muted-foreground));
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.dashboard-v2__title {
  font-size: 1.5rem;
  font-weight: 700;
  color: hsl(var(--foreground));
  line-height: 1.2;
}
.dashboard-v2__subtitle {
  font-size: 0.875rem;
  color: hsl(var(--muted-foreground));
  line-height: 1.4;
}
.dashboard-v2__actions {
  display: flex;
  gap: 0.5rem;
  flex-shrink: 0;
}
.dashboard-v2__main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
}
.dashboard-v2__column {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
/* Mobile Responsive */
@media (max-width: 1024px) {
  .dashboard-v2__main {
    grid-template-columns: 1fr;
  }
}
@media (max-width: 640px) {
  .ops-bar__stages {
    flex-wrap: wrap;
    gap: 0.375rem;
  }

  .ops-bar__connector,
  .ops-bar__divider {
    display: none;
  }

  .stage-pill {
    padding: 0.5rem 0.75rem;
  }

  .stage-pill__count {
    font-size: 1rem;
  }

  .dashboard-v2__header {
    flex-direction: column;
    gap: 1rem;
  }

  .dashboard-v2__actions {
    width: 100%;
  }

  .dashboard-v2__actions > * {
    flex: 1;
  }

  .insights-accordion__grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .nav-rail__desc {
    display: none;
  }
}
/* Dark Mode Refinements */
.dark .ops-bar,
.dark .action-queue,
.dark .quick-actions-panel,
.dark .recent-activity,
.dark .insights-accordion,
.dark .nav-rail__item {
  background: hsl(var(--card));
  border-color: hsl(var(--border) / 0.5);
}
.dark .stage-pill--active {
  background: hsl(var(--card));
  border-color: hsl(var(--border));
}
/* ============================================
   HERO METRICS - EXCEPTIONAL DESIGN
   ============================================ */
.hero-metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1rem;
}
@media (max-width: 1024px) {
  .hero-metrics {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (max-width: 640px) {
  .hero-metrics {
    grid-template-columns: 1fr;
  }
}
.hero-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  padding: 1.25rem;
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  border-radius: 0.75rem;
  overflow: hidden;
  transition: all 200ms ease;
}
.hero-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px hsl(var(--foreground) / 0.08);
}
.hero-card--large {
  grid-column: span 2;
  padding: 1.5rem;
}
@media (max-width: 640px) {
  .hero-card--large {
    grid-column: span 1;
  }
}
.hero-card__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}
.hero-card__label {
  font-size: 0.75rem;
  font-weight: 600;
  color: hsl(var(--muted-foreground));
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.hero-card__value {
  font-size: 2rem;
  font-weight: 700;
  color: hsl(var(--foreground));
  line-height: 1;
  letter-spacing: -0.02em;
}
.hero-card--large .hero-card__value {
  font-size: 2.5rem;
}
.hero-card__sparkline {
  margin-top: auto;
  opacity: 0.8;
}
.hero-card__accent {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--accent-color);
}
/* Progress Ring */
.progress-ring {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.progress-ring__value {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* Mini Chart */
.mini-chart {
  display: block;
}
/* ============================================
   SKELETON LOADING STATES
   ============================================ */
.dashboard-v2__skeleton {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}
.dashboard-v2__skeleton-header {
  height: 80px;
  background: linear-gradient(90deg, hsl(var(--muted)) 25%, hsl(var(--muted) / 0.5) 50%, hsl(var(--muted)) 75%);
  background-size: 200% 100%;
  animation: skeleton-pulse 1.5s ease-in-out infinite;
  border-radius: 0.75rem;
}
.dashboard-v2__skeleton-content {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
}
.dashboard-v2__skeleton-card {
  height: 300px;
  background: linear-gradient(90deg, hsl(var(--muted)) 25%, hsl(var(--muted) / 0.5) 50%, hsl(var(--muted)) 75%);
  background-size: 200% 100%;
  animation: skeleton-pulse 1.5s ease-in-out infinite;
  border-radius: 0.75rem;
}
@keyframes skeleton-pulse {
  0% {
    background-position: 200% 0;
  }
  100% {
    background-position: -200% 0;
  }
}
/* Unauth State */
.dashboard-v2__unauth {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 400px;
  text-align: center;
  gap: 1rem;
}
.dashboard-v2__unauth h2 {
  font-size: 1.5rem;
  font-weight: 700;
  color: hsl(var(--foreground));
}
.dashboard-v2__unauth p {
  font-size: 0.875rem;
  color: hsl(var(--muted-foreground));
  max-width: 300px;
}
