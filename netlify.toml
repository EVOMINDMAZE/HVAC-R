# ============================================
# Netlify Configuration
# ThermoNeural Frontend (SPA)
# ============================================

[build]
  # Build command
  command = "npm run build:client"
  
  # Output directory
  publish = "dist/spa"
  
  # Node.js version
  [build.environment]
    NODE_VERSION = "20"
    NPM_FLAGS = "--include=dev"
    NPM_CONFIG_PRODUCTION = "false"

# ============================================
# SPA Routing (React Router)
# ============================================
# All routes redirect to index.html for client-side routing

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================
# Headers
# ============================================

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-yrVTUxujjdXDCHCVH+3A7nX8VOTowqx2J8fX9qTEeCk=' 'sha256-2ZDcM36o65ajZKTcIgoX+JoREmtlxgKCJZ65OWh4lxI=' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://tbmizbqftczbsbwqgyjx.supabase.co https://148.116.87.10.sslip.io https://formsubmit.co https://api.sanity.io https://api.stripe.com; frame-src https://js.stripe.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self' https://formsubmit.co; frame-ancestors 'none'"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Service Worker - no cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Manifest - short cache
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ============================================
# Edge Functions (if needed)
# ============================================
# Uncomment if using Netlify Edge Functions
# [[edge_functions]]
#   function = "auth"
#   path = "/api/auth/*"

# ============================================
# Plugins
# ============================================
# Add Netlify plugins as needed
# [[plugins]]
#   package = "@netlify/plugin-lighthouse"

# ============================================
# Deploy Contexts
# ============================================

# Production context
[context.production]
  command = "npm run build:client"

# Deploy preview context
[context.deploy-preview]
  command = "npm run build:client"

# Branch deploy context
[context.branch-deploy]
  command = "npm run build:client"

# ============================================
# Notes:
# ============================================
# 
# 1. Environment Variables:
#    Set in Netlify Dashboard > Site Settings > Environment variables:
#    - VITE_SUPABASE_URL
#    - VITE_SUPABASE_ANON_KEY
#    - VITE_STRIPE_PUBLISHABLE_KEY (publishable key is safe client-side)
#    - VITE_STRIPE_PRICE_PRO
#    - VITE_STRIPE_PRICE_ENTERPRISE
#    - VITE_BILLING_ENABLED ("true" enables Stripe billing; absent/false =
#      honest disabled state — never mock billing)
#
# 2. Custom Domain:
#    Configure in Netlify Dashboard > Domain settings
#
# 3. Forms:
#    Netlify Forms are disabled (using Supabase)
#
# 4. Functions:
#    We use Supabase Edge Functions instead of Netlify Functions
